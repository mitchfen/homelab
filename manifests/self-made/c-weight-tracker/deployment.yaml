apiVersion: apps/v1
kind: Deployment
metadata:
  name: caroline-tracker
  namespace: caroline-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caroline-tracker
  template:
    metadata:
      labels:
        app: caroline-tracker
    spec:
      containers:
      - name: caroline-tracker
        image: ghcr.io/mitchfen/weight-tracker:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: DB_PATH
          value: /data/weights.db
        volumeMounts:
        - name: db
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: db
        hostPath:
          path: /var/lib/caroline-tracker
          type: DirectoryOrCreate