<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg:        #0f172a;
            --surface:   #1e293b;
            --border:    #334155;
            --text:      #f1f5f9;
            --muted:     #94a3b8;
            --accent:    #6366f1;
            --accent-bg: rgba(99, 102, 241, 0.12);
            --accent-border: rgba(99, 102, 241, 0.45);
            --shadow:    rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: 'IBM Plex Mono', monospace;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.5em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--muted);
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 480px;
        }

        .link {
            padding: 14px 20px;
            background: var(--surface);
            border-radius: 10px;
            text-decoration: none;
            color: var(--text);
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 2px 8px var(--shadow);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 14px;
            border: 1px solid var(--border);
        }

        .link:hover {
            transform: translateX(4px);
            box-shadow: 0 4px 16px var(--shadow);
            background: var(--accent-bg);
            border-color: var(--accent-border);
            color: var(--text);
        }

        @media (hover: none) {
            .link:hover {
                transform: none;
                box-shadow: 0 2px 8px var(--shadow);
                background: var(--surface);
                border-color: var(--border);
            }
        }

        .link-icon {
            font-size: 1.5em;
            flex-shrink: 0;
        }

        .link-name {
            font-weight: 600;
            font-size: 0.95em;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Tools -->
        <div class="section">
            <div class="section-title">
                🛠️ Tools
            </div>
            <div class="links">
                <a href="https://momentum.fenner.nexus" class="link">
                    <div class="link-icon">✅</div>
                    <div class="link-name">Momentum</div>
                </a>
                <a href="https://tracker.fenner.nexus" class="link">
                    <div class="link-icon">⚖️</div>
                    <div class="link-name">Weight Tracker</div>
                </a>
                <a href="https://wiz.fenner.nexus" class="link">
                    <div class="link-icon">💡</div>
                    <div class="link-name">WiZ Lights</div>
                </a>
                <a href="https://nanoleaf.fenner.nexus" class="link">
                    <div class="link-icon">🎨</div>
                    <div class="link-name">Nanoleaf Lights</div>
                </a>
                <a href="https://ai.fenner.nexus" class="link">
                    <div class="link-icon">🤖</div>
                    <div class="link-name">Local AI</div>
                </a>
				<!--
                <a href="https://pdf.fenner.nexus" class="link">
                    <div class="link-icon">📄</div>
                    <div class="link-name">Stirling PDF</div>
                </a>
				-->
                <a href="https://paste.fenner.nexus" class="link">
                    <div class="link-icon">📋</div>
                    <div class="link-name">Localpaste</div>
                </a>
            </div>
        </div>

        <!-- Admin -->
        <div class="section">
            <div class="section-title">
                ⚙️ Admin
            </div>
            <div class="links">
                <a href="http://192.168.1.1" class="link">
                    <div class="link-icon">🛡️</div>
                    <div class="link-name">pfSense Router</div>
                </a>
								<!--
                <a href="https://unifi.fenner.nexus" class="link">
                    <div class="link-icon">📡</div>
                    <div class="link-name">UniFi Controller</div>
                </a>
                <a href="https://portainer.fenner.nexus" class="link">
                    <div class="link-icon">🐳</div>
                    <div class="link-name">Portainer</div>
                </a>
								-->
                <a href="https://npm.fenner.nexus" class="link">
                    <div class="link-icon">🚦</div>
                    <div class="link-name">Nginx Proxy Manager</div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
