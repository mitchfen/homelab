apiVersion: v1
kind: Namespace
metadata:
  name: landing-page
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: landing-page-html
  namespace: landing-page
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home Services</title>
    
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
    
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                background: #f5f5f5;
                color: #333;
                padding: 20px;
                transition: background 0.3s, color 0.3s;
            }
    
            @media (prefers-color-scheme: dark) {
                body {
                    background: #1a1a1a;
                    color: #eee;
                }
            }
    
            .header {
                text-align: center;
                margin-bottom: 40px;
                display: none;
            }
    
            .container {
                max-width: 1200px;
                margin: 0 auto;
            }
    
            .section {
                margin-bottom: 40px;
            }
    
            .section-title {
                font-size: 1.5em;
                margin-bottom: 15px;
                opacity: 0.8;
                display: flex;
                align-items: center;
                gap: 10px;
            }
    
            .links {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
            }
    
            .link {
                padding: 15px;
                background: white;
                border-radius: 8px;
                text-decoration: none;
                color: #333;
                transition: all 0.3s;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 10px;
            }
    
            @media (prefers-color-scheme: dark) {
                .link {
                    background: #2a2a2a;
                    color: #eee;
                    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
                }
            }
    
            .link:hover {
                transform: translateY(-4px);
                box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            }
    
            @media (prefers-color-scheme: dark) {
                .link:hover {
                    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
                }
            }
    
            .link-icon {
                font-size: 2em;
                opacity: 0.8;
            }
    
            .link-name {
                font-weight: 600;
                font-size: 0.95em;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <h1>start.fenner.nexus</h1>
        </div>
    
        <div class="container">
            <!-- Tools -->
            <div class="section">
                <div class="section-title">
                    🛠️ Tools
                </div>
                <div class="links">
                    <a href="https://momentum.fenner.nexus" class="link">
                        <div class="link-icon">✅</div>
                        <div class="link-name">Momentum</div>
                    </a>
                    <a href="https://tracker.fenner.nexus" class="link">
                        <div class="link-icon">⚖️</div>
                        <div class="link-name">Weight Tracker</div>
                    </a>
                    <a href="https://wiz.fenner.nexus" class="link">
                        <div class="link-icon">💡</div>
                        <div class="link-name">WiZ Lights</div>
                    </a>
                    <a href="https://nanoleaf.fenner.nexus" class="link">
                        <div class="link-icon">🎨</div>
                        <div class="link-name">Nanoleaf</div>
                    </a>
                    <a href="https://pdf.fenner.nexus" class="link">
                        <div class="link-icon">📄</div>
                        <div class="link-name">Stirling PDF</div>
                    </a>
                    <a href="https://paste.fenner.nexus" class="link">
                        <div class="link-icon">📋</div>
                        <div class="link-name">Text Sharing</div>
                    </a>
                    <a href="https://npm.fenner.nexus" class="link">
                        <div class="link-icon">🚦</div>
                        <div class="link-name">npm</div>
                    </a>
                </div>
            </div>
    
            <!-- Admin -->
            <div class="section">
                <div class="section-title">
                    ⚙️ Admin
                </div>
                <div class="links">
                    <a href="http://192.168.1.1" class="link">
                        <div class="link-icon">🛡️</div>
                        <div class="link-name">pfSense</div>
                    </a>
                    <a href="https://unifi.fenner.nexus" class="link">
                        <div class="link-icon">📡</div>
                        <div class="link-name">UniFi Controller</div>
                    </a>
                    <a href="https://portainer.fenner.nexus" class="link">
                        <div class="link-icon">🐳</div>
                        <div class="link-name">Portainer</div>
                    </a>
                    <a href="http://draynor.home:81" class="link">
                        <div class="link-icon">🔄</div>
                        <div class="link-name">Nginx Proxy Manager</div>
                    </a>
                </div>
            </div>
        </div>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing-page
  namespace: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing-page
  template:
    metadata:
      labels:
        app: landing-page
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"
      volumes:
      - name: html
        configMap:
          name: landing-page-html
          items:
          - key: index.html
            path: index.html
---
apiVersion: v1
kind: Service
metadata:
  name: landing-page
  namespace: landing-page
spec:
  type: ClusterIP
  selector:
    app: landing-page
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
